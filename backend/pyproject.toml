[project]
name = "tender-search-backend"
version = "0.1.0"
description = "FastAPI backend skeleton for personalized search without ML implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.0",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "scikit-learn>=1.4.0",
  "catboost>=1.2.0",
  "joblib>=1.3.0",
  "pymorphy3>=2.0.0",
]

[project.optional-dependencies]
semantic = [
  "FlagEmbedding>=1.3.3",
  "faiss-cpu>=1.8.0",
  "torch>=2.2.0",
  "transformers>=4.44.2,<5.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
