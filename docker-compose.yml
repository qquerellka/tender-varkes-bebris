services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tender_search}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tender_search"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_SEMANTIC: ${BACKEND_INSTALL_SEMANTIC:-false}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Tender Search Backend}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      RANKING_MODE: ${RANKING_MODE:-ml_local_baseline}
      RANKING_PROVIDER: ${RANKING_PROVIDER:-local_ml}
      ML_ARTIFACTS_DIR: ${ML_ARTIFACTS_DIR:-/app/ML/models/catboost_ranker_v1}
      BOOTSTRAP_DATASET: ${BOOTSTRAP_DATASET:-auto}
      SYNTHETIC_DATA_DIR: ${SYNTHETIC_DATA_DIR:-/app/ML/data/synthetic}
      SYNTHETIC_DATA_TRUNCATE: ${SYNTHETIC_DATA_TRUNCATE:-true}
      SEARCH_SEMANTIC_ALLOW_REMOTE_DOWNLOAD: ${SEARCH_SEMANTIC_ALLOW_REMOTE_DOWNLOAD:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tender_search}
      DEMO_USER_ID: ${DEMO_USER_ID:-user_1}
      DEMO_ORGANIZATION_ID: ${DEMO_ORGANIZATION_ID:-org_1}
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ./ML:/app/ML:ro
      - huggingface_cache:/app/.cache/huggingface
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    command: >
      sh -c "alembic upgrade head &&
      python -m app.bootstrap &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
  huggingface_cache:
